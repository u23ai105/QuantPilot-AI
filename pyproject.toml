[project]
name = "quantpilot-ai"
version = "0.1.0"
description = "QuantPilot AI - Agentic Financial Research Assistant"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.27",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "structlog>=24.1.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.0",
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Upper bound pinned deliberately: the strategy interpreter depends on backtesting.py
    # internals (how `Strategy.__dict__` indicators are sliced per bar, `finalize_trades`),
    # so a major bump needs `tests/test_phase3_interpreter.py` re-verified first.
    "backtesting>=0.3.3,<0.7",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.0.0,<2.0",
    "openai>=1.109.1,<3.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.23.0",
    "pgvector>=0.2.5",
    # SQLAlchemy only requires greenlet for some platforms/extras, but every async DB call
    # here goes through it — declare it directly so no platform resolves without it.
    "greenlet>=3.0.0",
    # Prometheus exposition for GET /metrics. The plain client, not an instrumentator wrapper:
    # the metrics here are hand-rolled so the HTTP label set stays bounded (see app/core/metrics.py).
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    # scripts/generate_benchmark_pdf.py only — building eval fixtures, not needed at runtime.
    "reportlab>=4.0.0",
    # Celery dashboard, for watching queues and task history locally. A dev dependency on purpose:
    # the api and worker images have no reason to carry it, and compose runs Flower from its own
    # image (see the `flower` service) rather than from ours.
    "flower>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # Celery entrypoints and the app factory are exercised by the running services,
    # not by the suite; counting them just dilutes the signal.
    "app/workers/celery_app.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
