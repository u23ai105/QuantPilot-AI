[project]
name = "quantpilot-ai"
version = "0.1.0"
description = "QuantPilot AI - Agentic Financial Research Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.27",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "structlog>=24.1.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.0",
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "backtesting>=0.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]
