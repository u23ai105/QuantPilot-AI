services:
  # 1. FastAPI Backend + Celery Background Worker (Combined 100% Free Web Service)
  # Runs Alembic migrations, Celery worker in background, and FastAPI Uvicorn server in foreground.
  # This avoids Render's paid Background Worker tier ($7/mo) and ensures PDF uploads share the same filesystem.
  - type: web
    name: quantpilot-api
    env: python
    plan: free
    buildCommand: pip install .
    startCommand: bash scripts/start_production.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: EMBEDDING_PROVIDER
        value: local
      - key: NVIDIA_API_KEY
        sync: false

  # 2. React Frontend Static Site (100% Free Forever)
  - type: web
    name: quantpilot-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

